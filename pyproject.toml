[project]
name = "amma-yt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hari Narayan", email = "harinarayanmr@aol.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
amma-yt = "amma_yt:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
